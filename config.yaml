    pause_collection: '//android.widget.Button[@content-desc="暂停"]'
    more_collection: '//android.widget.ImageView[@content-desc="更多"]'
    collection_title: '//android.widget.Button[@content-desc="播放"]/../android.widget.TextView'
    collection_topic: '//android.widget.ImageView[@content-desc="收藏" or @content-desc="取消收藏"]/../android.widget.TextView'
