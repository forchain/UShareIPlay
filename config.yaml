soul:
#  room_owner: "Chainer"
  room_owner: "Joyer"
  package_name: "cn.soulapp.android"
  # 用于判定「当前不在 Soul 前台」时尝试切回（可与 config.local.yaml 追加厂商桌面包名）
  launcher_packages:
    - "com.sec.android.app.launcher"
  chat_activity: ".component.startup.main.MainActivity"
  #default_party_id: "FM18633292"
  default_party_id: "FM15321640"
  default_notice: "U Share I Play\n分享音乐 享受快乐"
  default_theme: "听歌"
  default_title: "听歌"
  broadcast_playing_info: false

  # 系统用户列表，这些用户不受等级限制
  system_users:
    - "Timer"
    - "Console"
    - "Agent"

  # 系统默认notice列表，如果房间notice包含这些内容说明被系统重置了
  system_default_notices:
    - "弹唱大会"
    - "Souler们在随便聊聊ing"
    - "蹲一个人"

  # 派对智能重启配置
  party_restart_minutes: 60 # 触发重启的时间（分钟），默认20小时
  # 派对创建模式：new_party_entry(新建) / restore_party(恢复)
  party_create_mode: "new_party_entry"
  # 创建派对时是否开启推荐：true(开启) / false(关闭)
  create_party_recommendation: true

  # 新建派对成功后的自动化（仅投递命令到 MessageQueue）
  post_party_create:
    enabled: true
    wait_for_command_ready: true
    commands:
      - ":skip"

  elements:
    message_list: "cn.soulapp.android:id/rvMessage"
    message_container: "//androidx.recyclerview.widget.RecyclerView[@resource-id='cn.soulapp.android:id/rvMessage']/android.view.ViewGroup"
    message_content: '//androidx.recyclerview.widget.RecyclerView[@resource-id="cn.soulapp.android:id/rvMessage"]//android.widget.TextView[@resource-id="cn.soulapp.android:id/tvContent"]'
    input_box_entry: "cn.soulapp.android:id/tvChat"
    input_box: "cn.soulapp.android:id/etInputView"
    button_send: "cn.soulapp.android:id/btnSend"
    tv_open_luck_bag: "cn.soulapp.android:id/tv_open_luck_bag" # 确认（礼物已经发放到你的背包中）
    new_message_tip: "cn.soulapp.android:id/tvNewMsgTip"
    floating_entry: "cn.soulapp.android:id/background"
