name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up uv and Python
        uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.12.23"
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync

      - name: Run Tests
        run: uv run pytest -q
